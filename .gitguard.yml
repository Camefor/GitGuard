version: 1

# 检测规则夹具中刻意构造了假密钥、假路径等命中样例，仅用于自动化测试，不参与本仓库自扫描。
exclude:
  paths:
    - "tests/**/Fixtures/**"

allowlist:
  entries:
    - rule_id: GGD/SECRET/AWS-AKID
      path_pattern: README.md
      reason: "README 中的 AWS 官方文档示例 Access Key 非真实凭据"
    - rule_id: GGD/URL/TOKEN-IN-QUERY
      path_pattern: tests/GitGuard.Cli.Tests/CliScanCommandTests.cs
      reason: "URL 白名单测试中的查询参数示例值，非真实凭据"
    - rule_id: GGD/URL/TOKEN-IN-QUERY
      path_pattern: tests/GitGuard.Detection.Tests/DetectorTests.cs
      reason: "URL 检测器测试中的查询参数示例值，非真实凭据"
    - rule_id: GGD/URL/CREDENTIALS-IN-URL
      path_pattern: tests/GitGuard.Detection.Tests/DetectorTests.cs
      reason: "URL 主机提取测试中的示例凭据，非真实凭据"
    - rule_id: GGD/PRIVACY/EMAIL
      path_pattern: tests/GitGuard.Detection.Tests/DetectorTests.cs
      reason: "URL 主机提取测试中的示例邮箱形态文本，非真实邮箱"
