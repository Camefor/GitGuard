name: CI

# 流水线阶段（16-测试方案 §11）：restore → build → unit → integration → scenario。
# 当前仅 Windows 单平台；macOS / Ubuntu 测试矩阵与 Linux DR-01 安全作业暂缓，恢复任务见 GGD-0028。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-test:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GitGuard.sln

      # TreatWarningsAsErrors（Directory.Build.props）：分析器 Error 级问题阻断合入（16-测试方案 §11）
      - name: Build (Release)
        run: dotnet build GitGuard.sln -c Release --no-restore

      # 格式门禁（13-开发规范 §10.3 / 16-测试方案 §11）：与本地 dotnet format 完全一致
      - name: Verify formatting
        run: dotnet format GitGuard.sln --verify-no-changes --no-restore

      - name: Unit tests - Core
        run: >
          dotnet test tests/GitGuard.Core.Tests/GitGuard.Core.Tests.csproj -c Release --no-build
          --report-xunit-trx --report-xunit-trx-filename core.trx
          --results-directory artifacts/test-results/core
          --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Unit tests - Detection
        run: >
          dotnet test tests/GitGuard.Detection.Tests/GitGuard.Detection.Tests.csproj -c Release --no-build
          --report-xunit-trx --report-xunit-trx-filename detection.trx
          --results-directory artifacts/test-results/detection
          --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Integration tests - Infrastructure
        run: >
          dotnet test tests/GitGuard.Infrastructure.Tests/GitGuard.Infrastructure.Tests.csproj -c Release --no-build
          --report-xunit-trx --report-xunit-trx-filename infrastructure.trx
          --results-directory artifacts/test-results/infrastructure
          --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Integration tests - Application
        run: >
          dotnet test tests/GitGuard.Application.Tests/GitGuard.Application.Tests.csproj -c Release --no-build
          --report-xunit-trx --report-xunit-trx-filename application.trx
          --results-directory artifacts/test-results/application
          --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Contract tests - CLI
        run: >
          dotnet test tests/GitGuard.Cli.Tests/GitGuard.Cli.Tests.csproj -c Release --no-build
          --report-xunit-trx --report-xunit-trx-filename cli.trx
          --results-directory artifacts/test-results/cli
          --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      # 真实 git commit / git push → Hook 分发脚本 → 真实 gitguard 子进程（16-测试方案 §12）
      - name: Scenario tests - E2E
        run: >
          dotnet test tests/GitGuard.E2E.Tests/GitGuard.E2E.Tests.csproj -c Release --no-build
          --report-xunit-trx --report-xunit-trx-filename e2e.trx
          --results-directory artifacts/test-results/e2e
          --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      # trx + coverage 归档（16-测试方案 §11）；失败时也上传，便于定位
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: artifacts/test-results/
          if-no-files-found: warn
          retention-days: 30

  # SRS NFR-A-001 / 16-测试方案 §2：在真实 Husky / lefthook / pre-commit 仓库中验证安装包裹、
  # 提交链执行、阻断语义与卸载还原。build-test 中未设置 GITGUARD_HOOK_COMPAT 时，这三个用例自动跳过。
  hook-compat:
    name: Hook compatibility (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit

      - name: Verify toolchain
        run: |
          git --version
          node --version
          npm --version
          pre-commit --version

      - name: Build (Release)
        run: dotnet build GitGuard.sln -c Release

      - name: Hook framework compatibility
        env:
          GITGUARD_HOOK_COMPAT: "1"
        run: >
          dotnet test tests/GitGuard.E2E.Tests/GitGuard.E2E.Tests.csproj -c Release --no-build
          --filter "FullyQualifiedName~HookFrameworkCompatibilityTests"
          --report-xunit-trx --report-xunit-trx-filename hook-compat.trx
          --results-directory artifacts/test-results/hook-compat
          --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-hook-compat-windows
          path: artifacts/test-results/
          if-no-files-found: warn
          retention-days: 30

  # 16-测试方案 §6 / GGD-0017：Git 2.9.3 / 2.40.1 / 最新稳定版的 E2E 兼容矩阵。
  # 托管 runner 只预装最新 Git，旧版本从 git-for-windows/git 官方 release 下载 PortableGit 后注入 PATH。
  git-compat:
    name: Git compatibility (${{ matrix.git }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - git: "2.9.3"
            legacy: true
          - git: "2.40.1"
            legacy: true
          - git: "latest"
            legacy: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Git ${{ matrix.git }}
        if: matrix.legacy
        shell: pwsh
        run: ./.github/scripts/install-git-version.ps1 -Version "${{ matrix.git }}"

      - name: Verify toolchain
        run: git --version

      - name: Build (Release)
        run: dotnet build GitGuard.sln -c Release

      - name: E2E tests - Git ${{ matrix.git }}
        run: >
          dotnet test tests/GitGuard.E2E.Tests/GitGuard.E2E.Tests.csproj -c Release --no-build
          --report-xunit-trx --report-xunit-trx-filename git-compat.trx
          --results-directory artifacts/test-results/git-compat
          --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-git-compat-${{ matrix.git }}
          path: artifacts/test-results/
          if-no-files-found: warn
          retention-days: 30
