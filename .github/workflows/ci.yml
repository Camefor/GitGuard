name: CI

# 流水线阶段（16-测试方案 §11）：restore → build → unit → integration → scenario → security。
# 三平台矩阵（NFR-A-002）：Windows 11 / macOS 14 / Ubuntu 24.04。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GitGuard.sln

      # TreatWarningsAsErrors（Directory.Build.props）：分析器 Error 级问题阻断合入（16-测试方案 §11）
      - name: Build (Release)
        run: dotnet build GitGuard.sln -c Release --no-restore

      - name: Unit tests - Core
        run: dotnet test tests/GitGuard.Core.Tests/GitGuard.Core.Tests.csproj -c Release --no-build

      - name: Unit tests - Detection
        run: dotnet test tests/GitGuard.Detection.Tests/GitGuard.Detection.Tests.csproj -c Release --no-build

      - name: Integration tests - Infrastructure
        run: dotnet test tests/GitGuard.Infrastructure.Tests/GitGuard.Infrastructure.Tests.csproj -c Release --no-build

      - name: Integration tests - Application
        run: dotnet test tests/GitGuard.Application.Tests/GitGuard.Application.Tests.csproj -c Release --no-build

      - name: Contract tests - CLI
        run: dotnet test tests/GitGuard.Cli.Tests/GitGuard.Cli.Tests.csproj -c Release --no-build

      # 真实 git commit / git push → Hook 分发脚本 → 真实 gitguard 子进程（16-测试方案 §12）
      - name: Scenario tests - E2E
        run: dotnet test tests/GitGuard.E2E.Tests/GitGuard.E2E.Tests.csproj -c Release --no-build

  # SRS NFR-A-001 / 16-测试方案 §2：在真实 Husky / lefthook / pre-commit 仓库中验证安装包裹、
  # 提交链执行、阻断语义与卸载还原。build-test 中未设置 GITGUARD_HOOK_COMPAT 时，这三个用例自动跳过。
  hook-compat:
    name: Hook compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit

      - name: Verify toolchain
        run: |
          git --version
          node --version
          npm --version
          pre-commit --version

      - name: Build (Release)
        run: dotnet build GitGuard.sln -c Release

      - name: Hook framework compatibility
        env:
          GITGUARD_HOOK_COMPAT: "1"
        run: dotnet test tests/GitGuard.E2E.Tests/GitGuard.E2E.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~HookFrameworkCompatibilityTests"

  security:
    name: Security (DR-01 localization)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish CLI (framework-dependent)
        run: dotnet publish src/GitGuard.Cli/GitGuard.Cli.csproj -c Release -o "$RUNNER_TEMP/gitguard-cli"

      - name: Install strace
        run: command -v strace >/dev/null || (sudo apt-get update && sudo apt-get install -y strace)

      # TC-DR-01-01：扫描全链路不得产生任何 AF_INET/AF_INET6 系统调用。
      # 金丝雀仅在内存中构造，扫描必然命中并返回 1；同时快照网络 syscall 供断言。
      - name: DR-01 - scan performs no outbound network syscalls
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/dr01-repo"
          home="$RUNNER_TEMP/dr01-home"
          mkdir -p "$repo" "$home"
          git -C "$repo" init --quiet --initial-branch=master
          git -C "$repo" config user.name "GitGuard CI"
          git -C "$repo" config user.email "gitguard-ci@example.com"
          canary="AKIA$(openssl rand -hex 8 | tr 'a-f' 'A-F')"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$canary" > "$repo/leak.env"
          git -C "$repo" add leak.env

          set +e
          (cd "$repo" && HOME="$home" strace -f -qq -e trace=network -o "$RUNNER_TEMP/network.trace" \
            "$RUNNER_TEMP/gitguard-cli/gitguard" --no-color scan --staged)
          scan_exit=$?
          set -e

          if [ "$scan_exit" -ne 1 ]; then
            echo "::error::expected scan to be blocked (exit 1), got $scan_exit"
            cat "$RUNNER_TEMP/network.trace"
            exit 1
          fi
          if grep -E 'AF_INET6?' "$RUNNER_TEMP/network.trace"; then
            echo "::error::DR-01 violation: outbound network syscalls detected"
            exit 1
          fi
          echo "DR-01 passed: no AF_INET/AF_INET6 syscalls during scan."
