name: Release

# 发行流程（14-部署文档 §3）：tag v* 或手动触发 → Native AOT 多 RID 构建 → 校验和 + zip 产物上传。
# RID 矩阵：Windows x64 / Linux x64 / macOS arm64（原生）+ macOS x64（在 arm64 runner 上交叉编译，无法本机冒烟）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version stamped into binaries (empty = 0.0.0-dev)"
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  aot:
    name: Native AOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            executable: gitguard.exe
            native: true
          - os: ubuntu-24.04
            rid: linux-x64
            executable: gitguard
            native: true
          - os: macos-14
            rid: osx-arm64
            executable: gitguard
            native: true
          - os: macos-14
            rid: osx-x64
            executable: gitguard
            native: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Native AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev zip

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ -z "$version" ]]; then
            version="0.0.0-dev"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "GitGuard version: $version"

      - name: Publish Native AOT
        shell: bash
        run: |
          dotnet publish src/GitGuard.Cli/GitGuard.Cli.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            -p:PublishAot=true \
            -p:Version="${{ steps.version.outputs.value }}" \
            -o publish

      # 交叉编译产物无法在宿主运行，不执行冒烟（14-部署文档 §10 由原生平台覆盖）
      - name: Smoke test (native host)
        if: matrix.native
        shell: bash
        run: ./publish/${{ matrix.executable }} version

      - name: Package (checksum + zip)
        shell: bash
        run: |
          set -euo pipefail
          rm -f publish/*.pdb publish/*.dbg publish/*.xml
          cd publish
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.executable }}" > SHA256SUMS
          else
            shasum -a 256 "${{ matrix.executable }}" > SHA256SUMS
          fi
          cd ..
          archive="gitguard-${{ steps.version.outputs.value }}-${{ matrix.rid }}.zip"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'publish/*' -DestinationPath '$archive' -Force"
          else
            (cd publish && zip -r "../$archive" .)
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitguard-${{ steps.version.outputs.value }}-${{ matrix.rid }}
          path: gitguard-${{ steps.version.outputs.value }}-${{ matrix.rid }}.zip
          if-no-files-found: error
          retention-days: 30
