# GitGuard 内置规则集（v1.0 进行中：45 条；目标 60 条）
# 依据：docs/模块设计/Secret.md §3、Privacy.md §3、LocalPathUrl.md §3；DDD §9 反模式（禁止在检测器代码中写死正则）。
# 字段说明：
#   id               规则 ID，必须符合 ^(GGD|USR|GLK)/[A-Z]+/[A-Z0-9_-]+$（13-开发规范 §4.1）
#   severity         Low / Medium / High / Critical（DDD §4.2）
#   pattern          .NET 正则；单引号 YAML 标量保持反斜杠字面量；以 200ms 超时编译（13-开发规范 §4.2）
#   context_keywords 非空时，命中行须包含任一关键字（大小写不敏感）
#   validators       声明式校验器：shannon-entropy / luhn / cn-id-checksum
#   enabled          省略视为 true；禁用规则不参与扫描
# 修改规则后必须同步 docs/模块设计/*.md 的规则表并补充 Fixtures 正负样本。

version: 1

rules:
  # ===== Secret（模块设计 Secret §3） =====
  - id: GGD/SECRET/AWS-AKID
    name: AWS Access Key ID
    severity: Critical
    pattern: '\bAKIA[0-9A-Z]{16}\b'
    enabled: true

  - id: GGD/SECRET/AWS-SECRET
    name: AWS Secret（弱启发）
    severity: Critical
    pattern: '(?<![A-Za-z0-9+/])[A-Za-z0-9+/]{40}(?![A-Za-z0-9+/])'
    context_keywords: [aws_secret, secret_access_key]
    validators: [shannon-entropy]
    enabled: true

  - id: GGD/SECRET/GITHUB-TOKEN
    name: GitHub PAT
    severity: Critical
    pattern: '\bgh[pousr]_[A-Za-z0-9_]{36,}\b'
    enabled: true

  - id: GGD/SECRET/PRIVATE-KEY
    name: PEM 私钥块
    severity: Critical
    pattern: '-----BEGIN (?:[A-Z ]*PRIVATE KEY)-----'
    enabled: true

  - id: GGD/SECRET/SLACK-TOKEN
    name: Slack Token
    severity: High
    pattern: '\bxox[baprs]-[A-Za-z0-9-]{10,}\b'
    enabled: true

  - id: GGD/SECRET/GENERIC-PASSWORD
    name: 代码中硬编码密码
    severity: High
    pattern: '(?i)(?:password|passwd|pwd)\s*["'']?\s*[:=]\s*["'']([^"'']{6,})["'']'
    enabled: true

  - id: GGD/SECRET/DB-CONN-STRING
    name: 带密码的连接串
    severity: High
    pattern: '(?i)(?:Server|Host|Data Source)\s*=\s*[^;\s]+;.*?Password\s*=\s*([^;\s]+)'
    enabled: true

  - id: GGD/SECRET/JWT
    name: JWT
    severity: Medium
    pattern: '(?<![A-Za-z0-9_-])eyJ[A-Za-z0-9_-]*\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+(?![A-Za-z0-9_-])'
    enabled: true

  - id: GGD/SECRET/GOOGLE-API-KEY
    name: Google API Key
    severity: High
    pattern: '\bAIza[0-9A-Za-z_-]{35}\b'
    enabled: true

  - id: GGD/SECRET/STRIPE-KEY
    name: Stripe 密钥
    severity: Critical
    pattern: '\b(?:sk|rk)_(?:live|test)_[0-9A-Za-z]{24,}\b'
    enabled: true

  - id: GGD/SECRET/NPM-TOKEN
    name: npm Access Token
    severity: High
    pattern: '\bnpm_[A-Za-z0-9]{36}\b'
    enabled: true

  - id: GGD/SECRET/GITLAB-TOKEN
    name: GitLab PAT
    severity: Critical
    pattern: '\bglpat-[A-Za-z0-9_-]{20,}\b'
    enabled: true

  - id: GGD/SECRET/OPENAI-KEY
    name: OpenAI API Key
    severity: Critical
    pattern: '\bsk-(?:proj-|svcacct-)?[A-Za-z0-9_-]{20,}\b'
    enabled: true

  - id: GGD/SECRET/SENDGRID-KEY
    name: SendGrid API Key
    severity: High
    pattern: '\bSG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}\b'
    enabled: true

  - id: GGD/SECRET/HUGGINGFACE-TOKEN
    name: Hugging Face Token
    severity: High
    pattern: '\bhf_[A-Za-z0-9]{34,}\b'
    enabled: true

  - id: GGD/SECRET/AZURE-STORAGE-KEY
    name: Azure Storage Account Key
    severity: High
    pattern: '(?<![A-Za-z0-9+/])[A-Za-z0-9+/]{86}==(?![A-Za-z0-9+/=])'
    context_keywords: [accountkey, azure, storage, 存储账户]
    enabled: true

  - id: GGD/SECRET/DIGITALOCEAN-TOKEN
    name: DigitalOcean Personal Access Token
    severity: Critical
    pattern: '\bdop_v1_[0-9a-f]{64}\b'
    enabled: true

  - id: GGD/SECRET/HASHICORP-VAULT-TOKEN
    name: HashiCorp Vault Token
    severity: Critical
    pattern: '\bhv[bsr]\.[A-Za-z0-9_-]{24,}\b'
    enabled: true

  - id: GGD/SECRET/POSTMAN-TOKEN
    name: Postman API Key
    severity: High
    pattern: '\bPMAK-[A-Fa-f0-9]{24}-[A-Fa-f0-9]{34}\b'
    enabled: true

  - id: GGD/SECRET/SHOPIFY-TOKEN
    name: Shopify Access Token
    severity: Critical
    pattern: '\bshp(?:at|ca|pa|ss)_[A-Fa-f0-9]{32}\b'
    enabled: true

  - id: GGD/SECRET/PYPI-TOKEN
    name: PyPI API Token
    severity: Critical
    pattern: '\bpypi-AgEIcHlwaS5vcmc[A-Za-z0-9_-]{50,}\b'
    enabled: true

  # ===== Privacy（模块设计 Privacy §3） =====
  - id: GGD/PRIVACY/CN-IDCARD-18
    name: 18 位身份证
    severity: High
    pattern: '(?<![0-9Xx])[0-9]{17}[0-9Xx](?![0-9Xx])'
    context_keywords: [id, idcard, id_card, 身份证]
    validators: [cn-id-checksum]
    enabled: true

  - id: GGD/PRIVACY/CN-BANKCARD
    name: 银行卡号
    severity: High
    pattern: '(?<![0-9])[0-9]{16,19}(?![0-9])'
    validators: [luhn]
    enabled: true

  - id: GGD/PRIVACY/CN-MOBILE
    name: 中国大陆手机号
    severity: Medium
    pattern: '(?<![0-9])1[3-9][0-9]{9}(?![0-9])'
    context_keywords: [phone, mobile, tel, 手机]
    enabled: true

  - id: GGD/PRIVACY/CN-IDCARD-15
    name: 15 位身份证
    severity: Medium
    pattern: '(?<![0-9])[1-9][0-9]{5}[0-9]{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12][0-9]|3[01])[0-9]{3}(?![0-9])'
    context_keywords: [id, idcard, id_card, 身份证]
    enabled: true

  - id: GGD/PRIVACY/EMAIL
    name: 邮箱
    severity: Low
    pattern: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
    enabled: true

  - id: GGD/PRIVACY/CN-PASSPORT
    name: 中国护照号
    severity: High
    pattern: '(?<![0-9A-Za-z])(?:E[0-9]{8}|G[0-9]{8}|[A-Z][0-9]{7,8})(?![0-9A-Za-z])'
    context_keywords: [passport, 护照]
    enabled: true

  - id: GGD/PRIVACY/CN-LANDLINE
    name: 中国大陆座机号
    severity: Medium
    pattern: '(?<![0-9])0[0-9]{2,3}-?[0-9]{7,8}(?![0-9])'
    context_keywords: [phone, tel, 电话, 座机]
    enabled: true

  - id: GGD/PRIVACY/US-SSN
    name: 美国社会安全号（SSN）
    severity: Medium
    pattern: '(?<![0-9])[0-9]{3}-[0-9]{2}-[0-9]{4}(?![0-9])'
    context_keywords: [ssn, social security, social_security, 社保号]
    enabled: true

  - id: GGD/PRIVACY/CN-NAME-ADDRESS
    name: 姓名与地址组合
    severity: Medium
    pattern: '(?:姓名|住址|地址)\s*[:：]\s*([^\s,，;；]{2,})'
    enabled: true

  - id: GGD/PRIVACY/IBAN
    name: IBAN 国际银行账号
    severity: High
    pattern: '\b[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}\b'
    context_keywords: [iban, bank, 银行, 账户]
    validators: [iban-checksum]
    enabled: true

  - id: GGD/PRIVACY/US-PHONE
    name: 美国电话号码
    severity: Medium
    pattern: '(?<![0-9])\(?[2-9][0-9]{2}\)?[-. ][2-9][0-9]{2}[-. ][0-9]{4}(?![0-9])'
    context_keywords: [phone, tel, mobile, cell, 电话]
    enabled: true

  - id: GGD/PRIVACY/UK-NINO
    name: 英国国民保险号（NINO）
    severity: Medium
    pattern: '(?<![A-Z0-9])[A-CEGHJ-PR-TW-Z][A-CEGHJ-NPR-TW-Z] ?[0-9]{2} ?[0-9]{2} ?[0-9]{2} ?[A-D](?![A-Z0-9])'
    context_keywords: [nino, ni number, national insurance, 国民保险]
    enabled: true

  - id: GGD/PRIVACY/CN-LICENSE-PLATE
    name: 中国机动车号牌
    severity: Medium
    pattern: '(?<![A-Za-z0-9])[京津沪渝冀豫云辽黑湘皖鲁新苏浙赣鄂桂甘晋蒙陕吉闽贵粤青藏川宁琼使领][A-HJ-NP-Z][A-HJ-NP-Z0-9]{4,5}[A-HJ-NP-Z0-9挂学警港澳](?![A-Za-z0-9])'
    context_keywords: [车牌, 号牌, plate, license]
    enabled: true

  - id: GGD/PRIVACY/DATE-OF-BIRTH
    name: 出生日期
    severity: Low
    pattern: '(?<![0-9])(?:19|20)[0-9]{2}[-/.](?:0[1-9]|1[0-2])[-/.](?:0[1-9]|[12][0-9]|3[01])(?![0-9])'
    context_keywords: [birth, dob, date of birth, 生日, 出生日期]
    enabled: true

  # ===== LocalPath（模块设计 LocalPathUrl §3.1） =====
  - id: GGD/LOCALPATH/UNIX-HOME
    name: Unix 用户主目录绝对路径
    severity: Low
    pattern: '/(?:home|Users)/[\w.-]+/'
    enabled: true

  - id: GGD/LOCALPATH/WIN-USER
    name: Windows 用户目录绝对路径
    severity: Low
    pattern: '[A-Za-z]:[\\/](?i:Users)[\\/][\w.-]+[\\/]'
    enabled: true

  - id: GGD/LOCALPATH/WIN-DRIVE
    name: Windows 驱动器盘符
    severity: Low
    pattern: '^[A-Za-z]:[\\/](?!(?i:Users)[\\/])'
    enabled: true

  - id: GGD/LOCALPATH/TEMP-WORK
    name: 常见临时/工作区绝对路径
    severity: Low
    pattern: '(?:/workspace/volumes/|/mnt/[a-z]/|~/workspace/)'
    enabled: true

  - id: GGD/LOCALPATH/UNC-SHARE
    name: Windows UNC 共享路径
    severity: Medium
    pattern: '\\\\[\w.-]+\\[\w.$-]+(?:\\[\w .$-]+)*'
    enabled: true

  - id: GGD/LOCALPATH/DEV-DIRS
    name: POSIX 部署目录绝对路径
    severity: Low
    pattern: '(?<![\w.-])/(?:opt|srv|data)/[\w.-]+/'
    enabled: true

  - id: GGD/LOCALPATH/HOME-TILDE
    name: 用户主目录 ~ 路径
    severity: Low
    pattern: '(?:^|[\s"''=(])(~/[\w.-]+(?:/[\w.-]+)+)'
    enabled: true

  # ===== Url（模块设计 LocalPathUrl §3.2） =====
  - id: GGD/URL/CREDENTIALS-IN-URL
    name: URL 带用户名密码
    severity: High
    pattern: '(?:https?|ftp)://([^/\s:@]+:[^@\s/]+)@'
    enabled: true

  - id: GGD/URL/TOKEN-IN-QUERY
    name: 查询参数含 token/apikey
    severity: High
    pattern: '[?&](?:token|apikey|access_token|api_key)=([^&\s]+)'
    enabled: true

  - id: GGD/URL/PRIVATE-IP
    name: 私有 / 环回 IP
    severity: Medium
    pattern: '(?<![0-9.])(?:10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|172\.(?:1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|127\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})(?![0-9.])'
    enabled: true

  - id: GGD/URL/LOCAL-HOSTNAME
    name: 内网域名
    severity: Medium
    pattern: '\b[\w-]+\.(?:local|internal|corp|lan)(?![\w.])'
    enabled: true

  - id: GGD/URL/SLACK-WEBHOOK
    name: Slack Webhook URL
    severity: High
    pattern: '\bhttps://hooks\.slack\.com/services/T[A-Z0-9]{8,}/B[A-Z0-9]{8,}/[A-Za-z0-9]{20,}\b'
    enabled: true

  - id: GGD/URL/DISCORD-WEBHOOK
    name: Discord Webhook URL
    severity: High
    pattern: '\bhttps://(?:(?:canary|ptb)\.)?discord(?:app)?\.com/api/webhooks/[0-9]{17,20}/[A-Za-z0-9_-]{60,}\b'
    enabled: true

  - id: GGD/URL/PASSWORD-QUERY
    name: 查询参数含密码
    severity: High
    pattern: '[?&](?:password|passwd|pwd|secret)=([^&\s#]+)'
    enabled: true

  - id: GGD/URL/AWS-SIGNED-URL
    name: AWS 预签名 URL
    severity: High
    pattern: '[?&]X-Amz-(?:Signature|Credential)=([^&\s]+)'
    enabled: true
